services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: vp-hono:latest
    container_name: vp-hono-app
    restart: unless-stopped
    ports:
      - "${PORT:-3000}:3000"
    environment:
      - NODE_ENV=production
      - DATABASE_URL=file:/app/data/database.sqlite
    volumes:
      - sqlite_data:/app/data

volumes:
  sqlite_data:
