name: Node.js Upstream Canary

on:
  schedule:
    - cron: "0 3 * * 1" # Weekly at 03:00 UTC on Mondays
  workflow_dispatch:

permissions:
  contents: read

env:
  CI: "true"
  NODE_ENV: development
  NO_COLOR: "1"
  NPM_CONFIG_ENGINE_STRICT: "false"

defaults:
  run:
    shell: bash

jobs:
  canary:
    name: Node.js Canary (Node ${{ matrix.node }} on ubuntu-latest)
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node:
          - 26
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Node.js ${{ matrix.node }}
        uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: npm
          check-latest: true

      - name: Install dependencies (bypassing strict engine constraint)
        run: npm ci --engine-strict=false

      - name: Create .env file
        run: cp .env.example .env

      - name: Initialize database
        run: npm run db:seed

      - name: Production build
        continue-on-error: true
        env:
          NODE_ENV: production
        run: npm run build

      - name: Run baseline unit and contract tests
        continue-on-error: true
        run: npm run agent:test:unit
