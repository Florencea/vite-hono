name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

env:
  CI: "true"
  NODE_ENV: development
  NO_COLOR: "1"

defaults:
  run:
    shell: bash

jobs:
  gatekeeper:
    name: Gatekeeper (Linux / Authoritative Node)
    runs-on: ubuntu-latest
    env:
      PLAYWRIGHT_BROWSERS_PATH: ${{ github.workspace }}/.cache/ms-playwright
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Vite+
        uses: voidzero-dev/setup-vp@v1
        with:
          node-version-file: package.json
          cache: true

      - name: Install dependencies
        run: vp install

      - name: Cache Vite Task Cache
        uses: actions/cache@v6
        with:
          path: node_modules/.vite/task-cache
          key: ${{ runner.os }}-vite-task-cache-${{ hashFiles('pnpm-lock.yaml') }}-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-vite-task-cache-${{ hashFiles('pnpm-lock.yaml') }}-
            ${{ runner.os }}-vite-task-cache-

      - name: Get Playwright version
        id: playwright-version
        run: echo "version=$(vp exec playwright --version | awk '{print $2}')" >> "$GITHUB_OUTPUT"

      - name: Cache Playwright Browsers
        uses: actions/cache@v6
        with:
          path: ${{ env.PLAYWRIGHT_BROWSERS_PATH }}
          key: ${{ runner.os }}-${{ runner.arch }}-playwright-${{ steps.playwright-version.outputs.version }}
          restore-keys: |
            ${{ runner.os }}-${{ runner.arch }}-playwright-

      - name: Setup test environment (Playwright Chromium)
        run: vp run test:setup

      - name: Initialize database
        run: vp run db:seed

      - name: Run typecheck
        run: vp run typecheck

      - name: Check (Oxlint & Oxfmt)
        run: vp check

      - name: Lint (Tailwind CSS)
        run: vp run lint:tailwind

      - name: Check dead code
        run: vp run check:deadcode

      - name: Run unit and contract tests
        run: vp run agent:test:unit

      - name: Build client and server
        env:
          NODE_ENV: production
        run: vp build

      - name: Run E2E browser tests
        run: vp run agent:test:e2e

      - name: Upload E2E artifacts on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: e2e-artifacts-${{ runner.os }}-${{ runner.arch }}
          path: |
            test-results/
            playwright-report/
            .vitest/
          if-no-files-found: ignore

  platform-compat:
    name: Platform Compatibility (${{ matrix.os }})
    needs: [gatekeeper]
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - windows-latest
          - macos-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Vite+
        uses: voidzero-dev/setup-vp@v1
        with:
          node-version-file: package.json
          cache: true

      - name: Install dependencies
        run: vp install

      - name: Cache Vite Task Cache
        uses: actions/cache@v6
        with:
          path: node_modules/.vite/task-cache
          key: ${{ runner.os }}-vite-task-cache-${{ hashFiles('pnpm-lock.yaml') }}-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-vite-task-cache-${{ hashFiles('pnpm-lock.yaml') }}-
            ${{ runner.os }}-vite-task-cache-

      - name: Initialize database
        run: vp run db:seed

      - name: Build client and server
        env:
          NODE_ENV: production
        run: vp build

      - name: Run lightweight unit and contract tests
        run: vp run agent:test:unit
