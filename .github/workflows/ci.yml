name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

env:
  CI: "true"
  NODE_ENV: development
  NO_COLOR: "1"

defaults:
  run:
    shell: bash

jobs:
  gatekeeper:
    name: Gatekeeper (Linux / Authoritative Node)
    runs-on: ubuntu-latest
    env:
      PLAYWRIGHT_BROWSERS_PATH: ${{ github.workspace }}/.cache/ms-playwright
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: package.json
          cache: npm
          check-latest: true

      - name: Install dependencies
        run: npm ci

      - name: Create .env file
        run: cp .env.example .env

      - name: Get Playwright version
        id: playwright-version
        run: echo "version=$(npx playwright --version | awk '{print $2}')" >> "$GITHUB_OUTPUT"

      - name: Cache Playwright Browsers
        uses: actions/cache@v6
        with:
          path: ${{ env.PLAYWRIGHT_BROWSERS_PATH }}
          key: ${{ runner.os }}-${{ runner.arch }}-playwright-${{ steps.playwright-version.outputs.version }}
          restore-keys: |
            ${{ runner.os }}-${{ runner.arch }}-playwright-

      - name: Setup test environment (Playwright Chromium)
        run: npm run test:setup

      - name: Initialize database
        run: npm run db:seed

      - name: Verify formatting
        run: npm run format:check

      - name: Run typecheck
        run: npm run agent:typecheck

      - name: Run lint
        run: npm run agent:lint

      - name: Check dead code
        run: npm run check:deadcode

      - name: Run unit and contract tests
        run: npm run agent:test:unit

      - name: Build client and server
        env:
          NODE_ENV: production
        run: npm run build

      - name: Run E2E browser tests
        run: npm run agent:test:e2e

      - name: Upload E2E artifacts on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: e2e-artifacts-${{ runner.os }}-${{ runner.arch }}
          path: |
            test-results/
            playwright-report/
            .vitest/
          if-no-files-found: ignore

  platform-compat:
    name: Platform Compatibility (${{ matrix.os }})
    needs: [gatekeeper]
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - windows-latest
          - macos-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: package.json
          cache: npm
          check-latest: true

      - name: Install dependencies
        run: npm ci

      - name: Create .env file
        run: cp .env.example .env

      - name: Initialize database
        run: npm run db:seed

      - name: Build client and server
        env:
          NODE_ENV: production
        run: npm run build

      - name: Run lightweight unit and contract tests
        run: npm run agent:test:unit
